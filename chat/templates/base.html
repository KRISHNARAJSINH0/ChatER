{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{% endblock %}</title>

    <link rel="stylesheet"
          href="{% static 'css/chat.css' %}">

</head>

<body>

    {% block content %}

    {% endblock %}

    {% if request.user.is_authenticated %}
        <script>
            const currentLoggedUser = "{{ request.user.username }}";
        </script>
        <script src="{% static 'js/notifications.js' %}"></script>
    {% endif %}

</body>

</html>
